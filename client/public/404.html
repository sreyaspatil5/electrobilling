<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#284f43" />
    <title>Page not found | ElectroBill</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #1b2c29; background-color: #f0f5f0; background-image: linear-gradient(rgba(40,79,67,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(40,79,67,.035) 1px, transparent 1px); background-size: 36px 36px; font-family: "DM Sans", Arial, sans-serif; }
      main { width: min(100%, 560px); padding: 48px 32px; border: 1px solid #dfe7df; border-radius: 8px; background: #fbfcf8; text-align: center; }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; font: 700 20px "Space Grotesk", Arial, sans-serif; text-decoration: none; }
      .brand img { width: 34px; height: 34px; }
      .code { margin: 40px 0 8px; color: #e56b42; font-size: 12px; font-weight: 700; }
      h1 { margin: 0; font: 700 clamp(30px, 8vw, 42px)/1.15 "Space Grotesk", Arial, sans-serif; }
      p { margin: 14px auto 25px; color: #5f7067; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
      nav a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 18px; border: 1px solid #284f43; border-radius: 5px; color: #284f43; font-size: 14px; font-weight: 700; text-decoration: none; }
      nav a:first-child { color: white; background: #284f43; }
      nav a:hover { filter: brightness(.94); }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/"><img src="/favicon.svg" alt="" />ElectroBill</a>
      <p class="code">ERROR 404</p>
      <h1>This page is not on the bill.</h1>
      <p>The address may be outdated or mistyped. Head back to ElectroBill or sign in to your workspace.</p>
      <nav aria-label="Recovery links">
        <a href="/">Product home</a>
        <a href="/login">Sign in</a>
      </nav>
    </main>
  </body>
</html>
